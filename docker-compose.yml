services:
  web:
    image: ${ANIFLOW_IMAGE:-ghcr.io/charlie237/aniflow:latest}
    build: .
    command: npm run start
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Optional: set AUTH_PASSWORD in .env to lock the UI/API
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ${ANIFLOW_IMAGE:-ghcr.io/charlie237/aniflow:latest}
    build: .
    command: node dist/worker.mjs
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    stop_grace_period: 30s
    restart: unless-stopped
