services:
  web:
    build: .
    command: npm run start
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # Optional: set AUTH_PASSWORD in .env to lock the UI/API
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    command: npm run worker
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
